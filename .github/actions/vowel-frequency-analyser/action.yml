name: 'Vowel Frequency Analyser'
description: 'Analyse the frequency of vowels in a given text file.'

inputs:
  file:
    description: 'The path to the text file to analyse (e.g., data.txt).'
    required: true

runs:
  using: 'docker'
  image: 'ghcr.io/georges034302/vowel-frequency-analyzer:latest'
  entrypoint: ['/bin/bash', '/github/scripts/entrypoint.sh']
  env:
    FILE: ${{ inputs.file }}
