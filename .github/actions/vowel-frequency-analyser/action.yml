name: 'Vowel Frequency Analyser'
description: 'Analyse the frequency of vowels in a given text file.'

inputs:
  file:
    description: 'The path to the text file to analyse (e.g., data.txt).'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Run Vowel Frequency Analyser
      shell: bash
      run: |
        python3 .github/scripts/frequency.py ${{inputs.file }}
        
    - name: Update README with Vowel Frequency
      shell: bash
      run: |
        bash .github/scripts/update_readme.sh
